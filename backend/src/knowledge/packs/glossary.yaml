# ─────────────────────────────────────────────────────────────────────────────
# GLOSSARY — the vocabulary, defined once
#
# The copilot speaks to manufacturing engineers, procurement, and quality people
# who do not share a dialect. A term defined here is defined for everyone; a
# definition that carries a common misunderstanding says so, because the
# misunderstanding is usually the expensive part.
# ─────────────────────────────────────────────────────────────────────────────

version: "1.0.0"

terms:

  - term: "DFM / DFMA"
    domain: method
    definition: >-
      Design for Manufacture (can it be made economically by the chosen process)
      and Design for Assembly (can the assembly be built with fewer, easier
      parts). DFA usually finds the larger savings, because deleting a part
      deletes its tooling, its inspection and its supply chain too.
    common_confusion: "DFM is often read as 'a checklist of radii'. Its real content is process selection and part-count reduction."
    source_id: boothroyd_dfma

  - term: "Should-cost"
    domain: cost
    definition: >-
      A bottom-up, physics-based estimate of what a part ought to cost given a
      process, a material, a volume and a set of rates — built from cycle time,
      material mass, setup, tooling amortisation and overhead.
    common_confusion: >-
      Confused with market price. A should-cost is an independent engineering
      estimate used to interrogate a quote, not a prediction of what anyone will
      charge.
    source_id: boothroyd_dfma

  - term: "Marginal cost (owned equipment)"
    domain: cost
    definition: >-
      The incremental resource cost of making a part on equipment you already
      own: material, consumables, energy, and the labour actually consumed —
      excluding the sunk capital of the machine.
    common_confusion: "Compared directly against a supplier's price, which includes their capital recovery, overhead and margin. The two answer different questions."
    source_id: boothroyd_dfma

  - term: "Datum reference frame (DRF)"
    domain: gdt
    definition: >-
      The coordinate system established by contacting datum features in a stated
      precedence order, against which located and oriented tolerances are
      verified.
    common_confusion: >-
      Treated as a measurement convenience. It is a functional statement: the DRF
      should reproduce how the part locates in its assembly, or inspection
      measures the wrong thing correctly.
    source_id: asme_y14_5

  - term: "Rule #1 (envelope principle)"
    domain: gdt
    definition: >-
      Under ASME Y14.5, the size tolerance of a regular feature of size also
      controls its form: at maximum material condition the feature must fit a
      perfect-form boundary.
    common_confusion: >-
      Assumed universal. ISO GPS defaults to the independency principle instead —
      form is NOT controlled by size unless (E) is invoked. Same drawing, two
      acceptance outcomes.
    source_id: asme_y14_5

  - term: "MMC and bonus tolerance"
    domain: gdt
    definition: >-
      Applying the maximum-material-condition modifier to a position tolerance
      allows additional positional tolerance as the feature departs from MMC —
      the 'bonus'. It is legitimate whenever the requirement is assembly
      clearance rather than alignment.
    common_confusion: >-
      Applied to form and profile controls, where it is not permitted — profile,
      circularity and cylindricity always apply regardless of feature size.
    source_id: asme_y14_5

  - term: "MBD / PMI"
    domain: cad
    definition: >-
      Model-Based Definition: the 3D model, not a drawing, is the authoritative
      product definition. Product and Manufacturing Information is the annotation
      (GD&T, notes, finishes) carried on that model.
    common_confusion: >-
      'We have PMI' can mean graphic PMI (pictures) or semantic PMI (machine-
      readable, face-linked). Only the latter survives to automated inspection.
    source_id: asme_y14_41

  - term: "B-rep vs mesh"
    domain: cad
    definition: >-
      A boundary representation defines faces as exact mathematical surfaces with
      topology; a mesh approximates them with triangles. B-rep is exact; a mesh
      is exact only to its chordal deviation.
    common_confusion: >-
      Measurements taken on a mesh are quoted to more digits than the tessellation
      supports. Radius, wall thickness and angle are all affected.
    source_id: asme_y14_41

  - term: "PSL (Product Specification Level)"
    domain: quality
    definition: >-
      API 6A's four-rung ladder of inspection, testing and documentation
      requirements. PSL-1 baseline; PSL-2 adds mandatory traceability, surface
      NDE and hardness; PSL-3 extends testing; PSL-4 adds full heat traceability,
      low-temperature impact testing, 100% NDE of pressure-containing welds and
      full dimensional inspection.
    common_confusion: "Read as a quality grade of the metal. It is a grade of evidence."
    source_id: api_6a

  - term: "PPAP"
    domain: quality
    definition: >-
      Production Part Approval Process: the 18-element evidence package proving a
      production process can make conforming parts at rate, submitted at the end
      of APQP.
    common_confusion: "Treated as paperwork at the end. It is the audit of whether APQP actually happened, and its content is decided during design."
    source_id: aiag_ppap

  - term: "FAI (First Article Inspection)"
    domain: quality
    definition: >-
      Per AS9102, a full verification of every drawing or model characteristic on
      a representative first production part, recorded on Forms 1–3 with the
      means of inspection stated.
    common_confusion: >-
      Confused with PPAP. FAI verifies one part against the definition (low-rate,
      aerospace); PPAP demonstrates process capability at rate (high-volume,
      automotive).
    source_id: as9102

  - term: "Special process"
    domain: quality
    definition: >-
      A process whose result cannot be fully verified by inspecting the finished
      product — heat treatment, welding, NDT, chemical processing, coating, and
      additive manufacturing. Control is by qualified procedure and accredited
      source instead.
    common_confusion: "Assumed covered by AS9100 certification. AS9100 does not require NADCAP; most primes require it by flow-down."
    source_id: nadcap

  - term: "Sour service"
    domain: materials
    definition: >-
      Service in an H2S-bearing environment severe enough to require
      NACE MR0175 / ISO 15156 material controls, determined from H2S partial
      pressure against in-situ pH, with chloride, temperature and elemental
      sulphur moving the boundary.
    common_confusion: "Treated as a yes/no property of an alloy. It is a property of the alloy within a stated environment."
    source_id: nace_mr0175

  - term: "HIP (hot isostatic pressing)"
    domain: process
    definition: >-
      Simultaneous high temperature and isostatic gas pressure that closes
      internal porosity and lack-of-fusion in castings and AM parts.
    common_confusion: >-
      Believed to fix everything. It cannot close surface-connected defects, it
      changes microstructure, and it changes dimensions — so machining stock has
      to survive it.
    source_id: astm_f2792_hip

  - term: "Key characteristic"
    domain: quality
    definition: >-
      A feature whose variation significantly affects fit, performance, service
      life or manufacturability, designated by engineering and controlled with
      statistical methods downstream.
    common_confusion: "Communicated by tight tolerance instead of explicit designation, so the shop cannot tell which tight dimensions actually matter."
    source_id: as9100

  - term: "Buy-to-fly ratio"
    domain: cost
    definition: "The mass of raw material purchased divided by the mass of the finished part. Aerospace machined parts routinely run 10:1 or worse."
    common_confusion: "Ignored in cost models that price only cutting time — on expensive alloys the removed material can dominate."
    source_id: boothroyd_dfma

  - term: "Process capability (Cp / Cpk / Ppk)"
    domain: quality
    definition: >-
      A ratio of the specification width to the process spread. Cpk and Ppk also
      penalise a mean that is off-centre; Ppk uses overall (long-term) variation
      and is what PPAP initial studies report.
    common_confusion: "Quoted from a short soft-tool run and presented as production capability."
    source_id: iatf_16949

  - term: "Gage R&R"
    domain: quality
    definition: "The share of observed variation attributable to the measurement system — repeatability plus reproducibility — usually expressed against the tolerance."
    common_confusion: >-
      Treated as a metrology problem. When the tolerance is too tight for any
      available gage, it is a design problem discovered very late.
    source_id: aiag_msa

  - term: "Technical data (export control)"
    domain: compliance
    definition: >-
      Under ITAR and the EAR, information required for the design, development,
      production or use of a controlled item — explicitly including CAD models,
      drawings and manufacturing process information.
    common_confusion: >-
      Assumed to mean documents rather than models, and assumed to require
      shipping something. Granting a foreign person read access to a server is an
      export; so is sending a model out for a quote.
    source_id: itar_ear

  - term: "Commercial-grade dedication"
    domain: quality
    definition: >-
      The nuclear process of accepting a commercially procured item into
      safety-related service by identifying its critical characteristics and
      verifying them independently, rather than relying on the supplier's
      certificate.
    common_confusion: "Read as extra paperwork on a purchase. It is an engineering activity, and the critical characteristics come from the design."
    source_id: asme_nqa1

  - term: "Execution class (EXC1–EXC4)"
    domain: quality
    definition: >-
      The structural-steelwork severity class that determines tolerance,
      inspection extent, traceability and welder qualification for a fabricated
      structure.
    common_confusion: "Assumed to be the fabricator's choice. The designer sets it; unstated, the fabricator defaults to the lowest."
    source_id: aws_d1_1_en_1090

  - term: "PED category (I–IV)"
    domain: quality
    definition: >-
      The EU Pressure Equipment Directive's hazard category, derived from
      pressure, volume or size, and fluid group — which then sets the
      conformity-assessment module and the level of notified-body involvement.
    common_confusion: >-
      Derived from pressure alone. Fluid group matters: the same vessel holding a
      dangerous fluid can jump categories and require a notified body.
    source_id: eu_ped

  - term: "TML / CVCM"
    domain: materials
    definition: >-
      Total mass loss and collected volatile condensable material — the ASTM E595
      vacuum outgassing screen. NASA's accepted limits are TML ≤ 1.0% and
      CVCM ≤ 0.10%.
    common_confusion: "Applied only to structural polymers, when labels, tapes, lubricants and conformal coatings need screening too."
    source_id: astm_e595

  - term: "Hydrogen embrittlement"
    domain: materials
    definition: >-
      Loss of ductility, toughness and fatigue resistance when atomic hydrogen
      dissolves into a metal lattice. Susceptibility runs inverse to strength.
    common_confusion: >-
      The instinct to solve a hydrogen pressure problem with a stronger material
      makes it worse. Hydrogen service uses its own allowable-stress tables for
      exactly this reason.
    source_id: asme_b31_12

  - term: "Dead leg"
    domain: process
    definition: >-
      A blind or stagnant branch in a fluid system where product is not swept by
      normal flow. Hygienic standards limit its length relative to diameter.
    common_confusion: "Treated as a piping detail. It is a geometric requirement that can be checked in the model before anything is fabricated."
    source_id: hygienic_design

  - term: "Corrosivity category (C1–CX)"
    domain: materials
    definition: >-
      ISO 9223's classification of atmospheric aggressiveness by time-of-wetness
      and chloride and sulphur dioxide deposition, from indoor-dry to extreme
      offshore and tropical industrial.
    common_confusion: "Replaced by adjectives like 'coastal' or 'industrial', which cannot be designed against or audited."
    source_id: iso_9223

  - term: "Clearance vs creepage"
    domain: platform
    definition: >-
      Clearance is the shortest path through air between conductors; creepage is
      the shortest path across an insulating surface. Both scale with voltage;
      creepage also scales with pollution degree.
    common_confusion: "Conflated. Creepage is the one contamination degrades, and the one ribs and grooves are used to lengthen."
    source_id: ipc_2221

  - term: "Rapid gas decompression (RGD)"
    domain: materials
    definition: >-
      Failure of an elastomer when gas dissolved into it under pressure expands
      during depressurisation, blistering or splitting the seal.
    common_confusion: "The seal fails during the pressure drop, not during service — so a seal that held perfectly can fail on shutdown."
    source_id: api_6a

  - term: "Sensitisation"
    domain: materials
    definition: >-
      Precipitation of chromium carbides at grain boundaries in austenitic
      stainless held around 425–815 °C, depleting chromium locally and opening
      the boundaries to intergranular attack.
    common_confusion: "Thought of as a heat-treatment problem. It happens in the heat-affected zone of every weld unless L or stabilised grades are used."
    source_id: asm_handbook

  - term: "Semantic vs graphic PMI"
    domain: cad
    definition: >-
      Graphic PMI stores annotation as lines and text — a picture of a tolerance.
      Semantic PMI stores it as a structured object with type, value, modifiers,
      datum references and links to the faces it applies to.
    common_confusion: >-
      They look identical in a viewer. Only semantic PMI can be extracted,
      ballooned or used to drive inspection, and only AP242 carries it.
    source_id: asme_y14_41

  - term: "Chordal deviation"
    domain: cad
    definition: "The maximum distance between a true curved surface and the flat triangles approximating it in a mesh."
    common_confusion: >-
      Ignored when quoting measurements from a mesh. It bounds the accuracy of
      every radius, wall thickness and angle taken from tessellated geometry.
    source_id: asme_y14_41

  - term: "A-basis / B-basis allowable"
    domain: materials
    definition: >-
      Statistically derived design allowables. A-basis: 99% of the population is
      expected to equal or exceed the value, at 95% confidence. B-basis: 90% at
      95% confidence. A-basis is used where failure of a single load path is
      critical; B-basis where load is redundantly carried.
    common_confusion: >-
      Confused with typical or minimum published properties from a datasheet.
      A typical value is roughly a mean and is not a design allowable at all.
    source_id: mil_hdbk_5h

  - term: "FMECA"
    domain: quality
    definition: >-
      Failure Mode, Effects and Criticality Analysis — the systematic
      identification of how a design or process can fail, what each failure
      causes, and how critical it is. The ancestor of the modern DFMEA and PFMEA.
    common_confusion: >-
      Treated as a document produced for a customer. Its value is entirely in
      being done early enough to change the design; done afterwards it is an
      archaeology exercise.
    source_id: mil_std_1629a

  - term: "Measurement uncertainty"
    domain: quality
    definition: >-
      A quantified doubt about a measurement result, stated as an interval with a
      coverage factor. Distinct from error, which is the unknown difference from
      the true value.
    common_confusion: >-
      A measured value quoted without its uncertainty cannot be compared with a
      tolerance honestly — the comparison silently assumes the measurement is
      exact.
    source_id: nist_publications

  - term: "Edge distance"
    domain: platform
    definition: >-
      The distance from a fastener hole centre to the nearest free edge, normally
      expressed in hole diameters. Below roughly two diameters the joint fails by
      tear-out rather than by the fastener.
    common_confusion: >-
      Assumed to be a workmanship detail. It is a structural requirement: the
      fastener's rated strength is irrelevant if the material behind it tears.
    source_id: faa_ac_43_13

  - term: "Preload"
    domain: platform
    definition: >-
      The tension induced in a fastener at assembly, which clamps the joint faces
      together so that service load is carried by friction rather than by the
      fastener in shear.
    common_confusion: >-
      Most bolted-joint failures are preload failures presenting as fastener
      failures. An unspecified torque is an unspecified joint.
    source_id: nasa_technical_standards

  - term: "Provenance (MEASURED / SHOP / USER / DEFAULT)"
    domain: platform
    definition: >-
      This platform's label for where a number came from: MEASURED (observed from
      reality), SHOP (a validated shop value), USER (declared by the customer),
      DEFAULT (a literature or engine assumption).
    common_confusion: >-
      Everything in this knowledge corpus is DEFAULT. Nothing here becomes
      MEASURED by being cited well.
    source_id: boothroyd_dfma
