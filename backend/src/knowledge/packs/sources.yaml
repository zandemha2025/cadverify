# ── Public-domain reference works (ingestible in full) ───────────────────────
#
# US Government works are not subject to copyright (17 USC 105). These are the
# closest free equivalents to the commercially-licensed handbooks, and they are
# the corpus's legitimate bulk-ingestion candidates. See INGESTION.md.

doe_hdbk_1017:
  tier: handbook
  title: "DOE Fundamentals Handbook — Material Science (Volumes 1–2)"
  publisher: "US Department of Energy"
  designation: "DOE-HDBK-1017/1-93 and /2-93"
  access: free
  licence: public_domain
  licence_note: "US Government work (17 USC 105). Published openly by the DOE Technical Standards Program."
  ingestion: full
  scope: >-
    Textbook-grade fundamentals: crystal structure and grain, stress and strain
    mechanisms in metals, failure modes (ductile and brittle fracture, fatigue,
    creep), thermal stress and shock, brittle-fracture and the ductile-to-brittle
    transition, and the behaviour of the metals used in nuclear plant. Written
    to teach, which makes it unusually good source material.

doe_hdbk_1018:
  tier: handbook
  title: "DOE Fundamentals Handbook — Mechanical Science (Volumes 1–2)"
  publisher: "US Department of Energy"
  designation: "DOE-HDBK-1018/1-93 and /2-93"
  access: free
  licence: public_domain
  licence_note: "US Government work (17 USC 105)."
  ingestion: full
  scope: >-
    Diesel engines, heat exchangers, pumps, valves, and the mechanical equipment
    fundamentals behind them — bearings, seals, fits and mechanical drive.

mil_hdbk_5h:
  tier: handbook
  title: "Metallic Materials and Elements for Aerospace Vehicle Structures"
  publisher: "US Department of Defense"
  designation: "MIL-HDBK-5H"
  edition: "1998, superseded"
  access: free
  licence: public_domain
  licence_note: "US Government work (17 USC 105); freely redistributable as a cancelled/superseded military handbook."
  ingestion: full
  scope: >-
    Design allowables and property data for aerospace metallic materials, plus
    the methodology behind statistically-derived A- and B-basis allowables,
    joint and fastener analysis, and fatigue and fracture data presentation.
  caution: >-
    **Superseded.** MIL-HDBK-5H was replaced by MMPDS, which is maintained by
    Battelle under paid membership and is the version the FAA accepts for
    showing compliance. Use MIL-HDBK-5H for methodology and design principles;
    do NOT present its allowables as current. Any actual allowable must come
    from the current MMPDS edition, licensed.

mil_std_1629a:
  tier: standard
  title: "Procedures for Performing a Failure Mode, Effects and Criticality Analysis"
  publisher: "US Department of Defense"
  designation: "MIL-STD-1629A"
  access: free
  licence: public_domain
  licence_note: "US Government work (17 USC 105); cancelled military standard, freely redistributable."
  ingestion: full
  scope: >-
    The original FMECA method — the ancestor of every DFMEA and PFMEA in use
    today, including criticality analysis. Cancelled but still the clearest
    statement of the underlying method.

nasa_technical_standards:
  tier: standard
  title: "NASA technical standards and the NASA Technical Reports Server"
  publisher: "NASA"
  designation: "NASA-STD series; NTRS"
  access: free
  licence: public_domain
  licence_note: "US Government works (17 USC 105). NTRS-hosted contractor reports may carry separate rights — check per document."
  ingestion: full
  scope: >-
    Fastener design and analysis, fracture control for spaceflight hardware,
    workmanship standards for soldering and crimping, structural design and test
    factors, materials and processes selection, and several decades of
    engineering reports behind them.
  caution: >-
    NTRS hosts some contractor- and journal-published material whose rights are
    not NASA's to grant. Verify per document rather than assuming the whole
    server is public domain.

faa_ac_43_13:
  tier: handbook
  title: "Acceptable Methods, Techniques and Practices — Aircraft Inspection and Repair"
  publisher: "US Federal Aviation Administration"
  designation: "FAA AC 43.13-1B / 43.13-2B"
  access: free
  licence: public_domain
  licence_note: "US Government work (17 USC 105)."
  ingestion: full
  scope: >-
    Intensely practical: inspection of structures, corrosion identification and
    treatment, welding and brazing practice, fastener and rivet selection, sheet
    metal repair, control cable and bonding practice. The best free source on
    what acceptable workmanship actually looks like.

nist_publications:
  tier: handbook
  title: "NIST technical publications and reference data"
  publisher: "US National Institute of Standards and Technology"
  designation: "NIST SP / TN / IR series"
  access: free
  licence: public_domain
  licence_note: "US Government work (17 USC 105)."
  ingestion: full
  scope: >-
    Measurement uncertainty and its expression, dimensional metrology practice,
    materials reference data including cryogenic properties, and the
    manufacturing-systems and model-based-definition research programme.

military_training_manuals:
  tier: handbook
  title: "US military trade training manuals"
  publisher: "US Army / US Navy"
  designation: "Army TM series; Navy NAVEDTRA rate training manuals"
  access: free
  licence: public_domain
  licence_note: "US Government works (17 USC 105). Freely redistributable, including the cancelled editions."
  ingestion: full
  scope: >-
    The closest free equivalent to the commercial trade handbooks, and written
    to take a reader from nothing to competent — which is exactly what a
    curriculum needs. Covers machine tools and machining practice, welding,
    foundry and patternmaking, sheet-metal layout and forming, and machinery
    repair, at genuine teaching depth with worked practice rather than summary.
  caution: >-
    Written for the equipment and materials of their era, so speeds, feeds and
    specific alloys are dated. The geometry, the mechanisms and the practice are
    not — use them for fundamentals and for teaching order, never for current
    machining data.

pre_1930_handbooks:
  tier: handbook
  title: "Pre-1930 engineering handbooks in the public domain"
  publisher: "various (originally Industrial Press, McGraw-Hill and others)"
  designation: "early editions of the classic mechanical handbooks"
  access: free
  licence: public_domain
  licence_note: >-
    US copyright has expired on works published before 1930, so the earliest
    editions of several still-current handbooks are public domain and available
    in full from library scanning projects. The CURRENT editions of the same
    titles remain fully protected — the licence attaches to the edition, never
    to the title.
  ingestion: full
  scope: >-
    Thread forms and standards, gear geometry, mechanics of materials, fits and
    limits, and shop mathematics — the parts of the field that were settled a
    century ago and have not moved since.
  caution: >-
    Materials data, allowables, safety practice and anything referencing a
    standard are obsolete and must not be used. Confirm the specific edition's
    publication date before relying on its status; a later edition of the same
    book is not free.

patent_literature:
  tier: handbook
  title: "Granted patent specifications"
  publisher: "USPTO / EPO / WIPO"
  designation: "published patent specifications"
  access: free
  licence: public_domain
  licence_note: >-
    Patent specifications are published by governments specifically to teach the
    invention, and the text is freely usable. The patent grants an exclusive
    right to PRACTISE the invention — reading and describing it is exactly what
    publication is for.
  ingestion: full
  scope: >-
    Process detail at a level rarely published elsewhere: tooling arrangements,
    process parameter windows, failure modes the applicant had to design around,
    and prior-art discussion that surveys a field. Full text is searchable free.
  caution: >-
    A patent describes what its applicant claimed, not established consensus.
    Treat it as one practitioner's account — useful for mechanism and for
    process detail, never as a standard.

usace_em:
  tier: handbook
  title: "US Army Corps of Engineers Engineer Manuals"
  publisher: "US Army Corps of Engineers"
  designation: "USACE EM series"
  access: free
  licence: public_domain
  licence_note: "US Government work (17 USC 105); published openly by USACE."
  ingestion: full
  scope: >-
    Painting and protective coatings, welded structural fabrication, corrosion
    control for civil works, and the inspection of steel hydraulic structures —
    unusually practical guidance on what long-life outdoor steelwork actually
    requires.

nrc_regulatory_guides:
  tier: standard
  title: "US Nuclear Regulatory Commission regulatory guides and NUREG reports"
  publisher: "US Nuclear Regulatory Commission"
  designation: "NRC Regulatory Guides; NUREG series"
  access: free
  licence: public_domain
  licence_note: "US Government work (17 USC 105)."
  ingestion: full
  scope: >-
    Acceptable methods for meeting 10 CFR 50 requirements — quality assurance
    programme content, material qualification, welding, NDE, and decades of
    failure analysis in the NUREG series.

# ── Trade-association technical literature (free to read, still copyrighted) ─
#
# These are the highest-value FREE sources in the corpus and a good illustration
# of the price/licence split: no paywall, all rights reserved. Facts may be
# stated with attribution; the text may not be ingested.

imoa_duplex:
  tier: handbook
  title: "Practical Guidelines for the Fabrication of Duplex Stainless Steels"
  publisher: "International Molybdenum Association"
  designation: "IMOA Duplex Fabrication Guidelines (3rd ed., 2014)"
  access: free
  licence: proprietary
  licence_note: "Freely downloadable from IMOA, but all rights reserved — free to read is not free to copy."
  ingestion: facts_only
  scope: >-
    The reference work on duplex stainless fabrication: maintaining the
    ferrite/austenite phase balance through welding, heat-input and interpass
    control, intermetallic (sigma) precipitation and how to avoid it, nitrogen
    in shielding and backing gas, ferrite measurement as quality control,
    forming, machining and pickling.
  caution: >-
    Directly relevant to sour and subsea service, where duplex and super duplex
    are frequently the only alloys satisfying the combined constraints — and
    where a fabrication error silently destroys the corrosion resistance the
    alloy was selected for.

nickel_institute:
  tier: handbook
  title: "Nickel Institute technical publications"
  publisher: "Nickel Institute"
  designation: "Nickel Institute technical guides"
  access: free
  licence: proprietary
  licence_note: "Freely downloadable, all rights reserved."
  ingestion: facts_only
  scope: >-
    Fabrication, welding and corrosion behaviour of stainless and nickel alloys,
    including alloy selection for specific corrosive media and the practical
    consequences of getting heat treatment or welding wrong.

ecss_space:
  tier: standard
  title: "European Cooperation for Space Standardization — space product assurance"
  publisher: ECSS / ESA
  designation: "ECSS-Q-ST-70 series"
  access: free
  licence: proprietary
  licence_note: "Downloadable after registration and acceptance of the ECSS licence agreement; not public domain."
  ingestion: facts_only
  scope: >-
    Materials, mechanical parts and processes for spaceflight hardware:
    materials and processes selection and approval, outgassing and contamination
    control, and the declared-materials-list discipline. The European
    counterpart to the NASA standards.

# ── Practice-tier and contested rules ────────────────────────────────────────

shop_practice_machining:
  tier: practice
  title: "General machine-shop practice (consensus of published DFM guides)"
  publisher: "industry consensus"
  designation: "shop practice — machining"
  access: free
  scope: >-
    Rules everyone teaches and no one owns: 3:1 pocket depth-to-tool-diameter
    before chatter management dominates, internal radii sized above the tool
    radius rather than equal to it, 4:1 unsupported-length limits on small tools.
  caution: "No authority behind these. They are strong priors, not requirements."

shop_practice_sheet_metal:
  tier: contested
  title: "Sheet-metal minimum feature rules (sources disagree)"
  publisher: "industry consensus"
  designation: "shop practice — sheet metal"
  access: free
  scope: >-
    Minimum flange length is published as 3×t by some fabricators and 4×t by
    others; hole-to-bend is published as 2×t, and as 1.5×t + bend radius.
  disagreement: >-
    The spread is real and comes from tooling: a shop with narrow press-brake
    dies holds shorter flanges than one running standard V-dies. Encode the
    range; let the shop's own capability override it.

shop_practice_moulding:
  tier: practice
  title: "Injection-moulding design consensus (Protolabs, Xometry, moulder guides)"
  publisher: "industry consensus"
  designation: "shop practice — injection moulding"
  access: free
  scope: >-
    Uniform nominal wall 1.5–4 mm for engineering thermoplastics; ribs at
    50–65% of nominal wall to avoid sink; rib base fillet 0.25–0.5× nominal
    wall; rib spacing ≥ 2× nominal wall; 1° draft per 25 mm of draw as a
    starting point, plus ~1.5° extra per 0.025 mm of texture depth.

shop_practice_polymer_am:
  tier: practice
  title: "Polymer AM design consensus (service-bureau and printer-OEM guides)"
  publisher: "industry consensus"
  designation: "shop practice — polymer AM"
  access: free
  scope: >-
    The published consensus across polymer AM service bureaux and printer OEMs:
    FDM minimum wall around three perimeters (~1.2 mm) and 2–3 mm for loaded
    parts, unsupported bridging to roughly 10 mm (25 mm with active cooling),
    dimensional capability around ±0.3 mm or ±0.3%; SLA vertical wall from
    1.5 mm and hollow wall from 2 mm with drain holes of 3.5–4 mm; SLS/MJF
    minimum wall 0.8 mm (2.5–3 mm loaded), moving-part clearance 0.5–0.7 mm,
    internal channels ≥ 2 mm, escape holes 3.5–4 mm.
  caution: >-
    These are bureau capability statements, not standards. They describe what a
    given provider will accept on a given machine and material, and they differ
    between providers. Treat as a strong default that a shop profile overrides.

vendor_binder_jet:
  tier: vendor
  title: "Metal binder jetting design guides (printer OEMs)"
  publisher: "binder jet OEMs"
  designation: "binder jet OEM design guide"
  access: free
  scope: >-
    Green-state handling minimum wall of about 2 mm (below 0.75 mm the green
    part lacks strength), minimum fillet radius around 1 mm to prevent green
    cracking, minimum hole about 1.5 mm, escape holes about 5 mm, and sintering
    shrinkage from roughly 0.8–3% infiltrated up to about 20% for full sinter.
  caution: >-
    Shrinkage and achievable tolerance are strongly machine-, alloy- and
    geometry-specific, and OEM figures assume their own sinter profile and
    setters.

shop_practice_edm:
  tier: practice
  title: "EDM design consensus (job-shop and machine-builder guidance)"
  publisher: "industry consensus"
  designation: "shop practice — EDM"
  access: free
  scope: >-
    Minimum wire-EDM internal corner radius as wire radius plus spark gap
    (about 0.15 mm for a 0.25 mm wire), wire diameters of roughly 0.10–0.30 mm,
    taper capability to about ±30° at much reduced speed, practical stock
    heights of roughly 10–300 mm, and a start hole for every internal profile.

asm_forging_design:
  tier: handbook
  title: "Forging design, dimensions and tolerances"
  publisher: ASM International
  designation: "ASM Handbook — bulk forming / closed-die forging design"
  access: paid
  scope: >-
    Closed-die forging design: parting line and flash, web and rib proportions
    for metal flow, standard draft around 1° (tighter only for high-tolerance
    work), and the rule that dimensions across the parting plane carry worse
    tolerance than dimensions contained within a single die half, because they
    depend on die closure, die wear and final flash thickness.

iso_8062:
  tier: standard
  title: "Geometrical product specifications (GPS) — Dimensional and geometrical tolerances for moulded parts"
  publisher: ISO
  designation: "ISO 8062"
  access: paid
  scope: >-
    Casting tolerance grades (CT/DCTG) and required machining allowance grades.
    The correct way to tolerance an as-cast surface instead of inventing a
    machined-class number for it.

iso_astm_52907:
  tier: standard
  title: "Additive manufacturing — Feedstock materials — Methods to characterize metal powders"
  publisher: ISO / ASTM
  designation: "ISO/ASTM 52907"
  access: paid
  scope: >-
    Sampling and characterisation of metal AM powder — chemistry, particle size
    distribution, flow, apparent density. The basis for treating a powder lot
    with the same seriousness as a heat number.

dfam_practice:
  tier: practice
  title: "Design for additive manufacturing consensus"
  publisher: "industry consensus"
  designation: "shop practice — DfAM"
  access: free
  scope: >-
    The 45° self-supporting overhang heuristic for L-PBF; powder-evacuation
    ports of roughly 2 mm or larger on enclosed volumes; minimum unsupported
    hole diameter around 1.5 mm for polymer powder bed.
  caution: >-
    45° is a heuristic, not a physical constant. Achievable angle depends on
    alloy, layer thickness, laser parameters, and the surface finish accepted
    on the down-skin. Well-tuned machines print 30–40° routinely.
