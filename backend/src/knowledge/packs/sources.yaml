# ─────────────────────────────────────────────────────────────────────────────
# THE CITATION REGISTRY
#
# Every source referenced anywhere in the knowledge corpus is defined here,
# exactly once. Rules reference sources by `source_id`; the loader fails
# validation if a rule cites an id that is not in this file.
#
# tier: standard | vendor | handbook | practice | contested
#   standard  — published consensus standard, citable to a clause
#   vendor    — a machine/material vendor's published capability
#   handbook  — established engineering reference, consensus, no clause
#   practice  — widely-taught shop practice, no single authority
#   contested — reputable sources materially disagree (record the range)
#
# `edition` is recorded when the requirement is edition-sensitive (it usually
# is). `access` says whether the text is free — an auditor will ask.
# ─────────────────────────────────────────────────────────────────────────────

# ── Dimensioning, tolerancing, metrology ─────────────────────────────────────

asme_y14_5:
  tier: standard
  title: "Dimensioning and Tolerancing"
  publisher: ASME
  designation: "ASME Y14.5-2018"
  edition: "2018 (reaffirmed 2024)"
  access: paid
  scope: >-
    The US GD&T language: symbols, datum reference frames, material condition
    modifiers, profile, position, runout. Y14.5-2018 supersedes Y14.5-2009;
    drawings and models must state which edition governs.

asme_y14_41:
  tier: standard
  title: "Digital Product Definition Data Practices"
  publisher: ASME
  designation: "ASME Y14.41"
  access: paid
  scope: >-
    How to put product definition on the model instead of a drawing — the
    model-based definition (MBD) rulebook, including annotation planes,
    saved views, and what a query-only model may and may not assert.

iso_gps_1101:
  tier: standard
  title: "Geometrical product specifications (GPS) — Geometrical tolerancing"
  publisher: ISO
  designation: "ISO 1101"
  access: paid
  scope: >-
    The ISO GPS counterpart to ASME Y14.5. NOT interchangeable: ISO defaults to
    the independency principle unless (E) is invoked; ASME defaults to Rule #1
    (envelope). A part toleranced under one and inspected under the other can be
    accepted or rejected wrongly.

iso_2768:
  tier: standard
  title: "General tolerances for linear and angular dimensions"
  publisher: ISO
  designation: "ISO 2768-1 / -2"
  access: paid
  scope: >-
    Blanket tolerance classes (f/m/c/v for linear, H/K/L for geometrical) that
    apply to every dimension without an explicit tolerance. Widely invoked by a
    title-block note; widely misunderstood as "no tolerance required".

iso_286:
  tier: standard
  title: "ISO code system for tolerances on linear sizes (limits and fits)"
  publisher: ISO
  designation: "ISO 286-1 / -2"
  access: paid
  scope: "The H7/g6-style fit system: shaft/hole tolerance grades and deviations."

iso_4287:
  tier: standard
  title: "Surface texture: profile method — terms, definitions, parameters"
  publisher: ISO
  designation: "ISO 4287 / ISO 21920 series"
  access: paid
  scope: >-
    Defines Ra, Rz, Rq and the filtering that makes them meaningful. Ra without
    a stated cut-off and evaluation length is not a specification.

# ── Oil, gas, pressure ───────────────────────────────────────────────────────

api_6a:
  tier: standard
  title: "Specification for Wellhead and Christmas Tree Equipment"
  publisher: API
  designation: "API Spec 6A"
  edition: "21st edition (+ addenda/errata)"
  access: paid
  scope: >-
    Design, materials, welding, NDE, testing and documentation for surface
    wellhead equipment. Carries the PSL 1–4 ladder: PSL-1 is baseline; PSL-2
    adds mandatory traceability plus surface NDE and hardness; PSL-3 extends
    testing/hydro duration; PSL-4 adds full heat traceability, low-temperature
    impact testing, 100% NDE of pressure-containing welds, hardness survey,
    gas seat testing and full dimensional inspection.

api_q1:
  tier: standard
  title: "Specification for Quality Management System Requirements for Manufacturing Organizations for the Petroleum and Natural Gas Industry"
  publisher: API
  designation: "API Spec Q1"
  access: paid
  scope: >-
    The QMS a monogram licensee must run. Where API 6A says what the product
    must be, Q1 says what the *organisation* must be — design control, risk
    assessment, contingency planning, supplier control, MOC.

nace_mr0175:
  tier: standard
  title: "Petroleum and natural gas industries — Materials for use in H2S-containing environments in oil and gas production"
  publisher: NACE / ISO
  designation: "NACE MR0175 / ISO 15156 (Parts 1–3)"
  access: paid
  scope: >-
    Governs material selection for sour (H2S) service. Part 1 sets the selection
    principles and the sour-service definition by H2S partial pressure and pH;
    Part 2 covers carbon and low-alloy steels (the ≤ 22 HRC / 248 HBW ceiling
    for SSC resistance, applied to base metal, weld metal and HAZ); Part 3 lists
    qualified corrosion-resistant alloys with their environmental limits.
  caution: >-
    Compliance is environment-specific. "NACE material" is not a property of an
    alloy in the abstract — an alloy is qualified only within stated limits of
    H2S partial pressure, chloride, pH, temperature and elemental sulphur.

asme_bpvc_viii:
  tier: standard
  title: "Boiler and Pressure Vessel Code, Section VIII — Rules for Construction of Pressure Vessels"
  publisher: ASME
  designation: "ASME BPVC Section VIII, Div. 1 / Div. 2"
  access: paid
  scope: >-
    Pressure-retaining wall thickness by calculation, joint efficiency, nozzle
    reinforcement, and the examination that backs each. Div. 1 is rule-based
    with higher design margin; Div. 2 is analysis-based, thinner walls, far more
    documentation and NDE.

asme_bpvc_ix:
  tier: standard
  title: "Boiler and Pressure Vessel Code, Section IX — Welding, Brazing and Fusing Qualifications"
  publisher: ASME
  designation: "ASME BPVC Section IX"
  access: paid
  scope: "WPS / PQR / WPQ — how a weld procedure and a welder become qualified."

api_5l:
  tier: standard
  title: "Specification for Line Pipe"
  publisher: API
  designation: "API Spec 5L"
  access: paid
  scope: "Line pipe grades, chemistry, mechanical and testing; PSL1 vs PSL2."

# ── Aerospace ────────────────────────────────────────────────────────────────

as9100:
  tier: standard
  title: "Quality Management Systems — Requirements for Aviation, Space and Defense Organizations"
  publisher: SAE / IAQG
  designation: "AS9100D (EN 9100 / JISQ 9100)"
  access: paid
  scope: >-
    ISO 9001 plus aerospace: configuration management, counterfeit-part
    prevention, product safety, special-process control, FOD, key characteristics.

as9102:
  tier: standard
  title: "Aerospace First Article Inspection Requirement"
  publisher: SAE
  designation: "AS9102"
  access: paid
  scope: >-
    The FAI: every drawing/model characteristic ballooned, numbered, measured
    and recorded on Forms 1–3, with the specific means of inspection and the
    material/special-process certifications attached.

as9145:
  tier: standard
  title: "Requirements for Advanced Product Quality Planning and Production Part Approval Process"
  publisher: SAE
  designation: "AS9145"
  access: paid
  scope: "APQP/PPAP for aerospace; integrates with 9100, 9102 and 9103."

nadcap:
  tier: standard
  title: "NADCAP special process accreditation"
  publisher: PRI / PerformanceReview Institute
  designation: "NADCAP (AC7100 series audit criteria)"
  access: paid
  scope: >-
    Accreditation of *special processes* — heat treat, NDT, chemical processing,
    welding, coatings, materials testing, and AM — where conformity cannot be
    verified by inspecting the finished part. Not required by AS9100 itself;
    required by most primes via flow-down.

# ── Medical ──────────────────────────────────────────────────────────────────

iso_13485:
  tier: standard
  title: "Medical devices — Quality management systems — Requirements for regulatory purposes"
  publisher: ISO
  designation: "ISO 13485:2016"
  access: paid
  scope: "The device QMS: design controls, DHF/DMR/DHR, validation, traceability, complaint handling."

fda_820:
  tier: standard
  title: "Quality System Regulation / Quality Management System Regulation"
  publisher: US FDA
  designation: "21 CFR Part 820"
  edition: "QMSR harmonisation with ISO 13485 effective 2026-02-02"
  access: free
  licence: public_domain
  licence_note: "US Government work — edicts of government are not subject to copyright (17 USC 105)."
  ingestion: full
  scope: >-
    US device quality regulation. §820.30 design controls — design inputs,
    outputs, review, verification, validation, transfer, changes, and the DHF —
    is the clause a design-side audit lives in.

iso_10993:
  tier: standard
  title: "Biological evaluation of medical devices"
  publisher: ISO
  designation: "ISO 10993 series"
  access: paid
  scope: >-
    Biocompatibility. Critically, it evaluates the *finished device including
    its manufacturing residues* — so process, cleaning and surface finish are
    part of the biological argument, not just the alloy.

# ── Automotive ───────────────────────────────────────────────────────────────

iatf_16949:
  tier: standard
  title: "Quality management system requirements for automotive production and relevant service parts organizations"
  publisher: IATF
  designation: "IATF 16949:2016"
  access: paid
  scope: "Automotive QMS on top of ISO 9001: APQP, FMEA, MSA, SPC, control plans, PPAP."

aiag_ppap:
  tier: standard
  title: "Production Part Approval Process"
  publisher: AIAG
  designation: "AIAG PPAP, 4th edition"
  access: paid
  scope: >-
    The 18-element evidence package (design records, change documents, FMEAs,
    process flow, control plan, MSA, dimensional results, material/performance
    test results, initial process studies, qualified laboratory documentation,
    appearance approval, sample product, master sample, checking aids,
    customer-specific requirements, and the Part Submission Warrant) with
    submission levels 1–5.

aiag_vda_fmea:
  tier: standard
  title: "FMEA Handbook (Design FMEA and Process FMEA)"
  publisher: AIAG / VDA
  designation: "AIAG-VDA FMEA Handbook, 1st edition"
  access: paid
  scope: >-
    The 7-step FMEA replacing RPN with Action Priority (AP). A DFMEA that still
    ranks by RPN is an audit finding at most OEMs.

aiag_msa:
  tier: standard
  title: "Measurement Systems Analysis"
  publisher: AIAG
  designation: "AIAG MSA, 4th edition"
  access: paid
  scope: >-
    Gage R&R and friends. The rule that bites design: a characteristic whose
    tolerance is tight relative to gage capability will fail MSA regardless of
    how well it is machined.

# ── Pressure equipment, rail, marine, structural, defence, hygienic ──────────

eu_ped:
  tier: standard
  title: "Pressure Equipment Directive"
  publisher: "European Union"
  designation: "Directive 2014/68/EU (PED)"
  access: free
  licence: open
  licence_note: >-
    EU legislative text, reusable with acknowledgement of source under the
    Commission's reuse policy. The harmonised standards it references are NOT
    free — they are CEN documents and remain proprietary.
  ingestion: full
  scope: >-
    EU market access for pressure equipment. Categorises equipment I–IV from
    pressure, volume and fluid group, and assigns a conformity-assessment module
    accordingly — with notified-body involvement rising with category. Requires
    material qualification (harmonised spec, European approval, or particular
    material appraisal) and CE marking with a declaration of conformity.
  caution: >-
    A vessel built to ASME BPVC is not automatically PED-compliant, and vice
    versa. The two regimes differ in material approval route, examination and
    documentation, so dual-market equipment is designed for both from the start
    or requalified expensively later.

en_15085:
  tier: standard
  title: "Railway applications — Welding of railway vehicles and components"
  publisher: CEN
  designation: "EN 15085 (parts 1–5)"
  access: paid
  scope: >-
    Certification of welding organisations for rail, with weld performance
    classes tied to safety and stress category. Determines the examination
    level, the welding coordination personnel required, and the acceptance
    criteria for each weld on the vehicle.

iris_22163:
  tier: standard
  title: "Railway applications — Quality management system — Business management system requirements for rail organizations"
  publisher: ISO / IRIS
  designation: "ISO/TS 22163 (IRIS)"
  access: paid
  scope: >-
    The rail-sector QMS built on ISO 9001, adding project management, RAMS
    (reliability, availability, maintainability, safety), obsolescence
    management, configuration management and first-article inspection.

marine_class:
  tier: standard
  title: "Classification society rules for materials and welding"
  publisher: "DNV / ABS / Lloyd's Register / BV"
  designation: "Class society rules (DNV, ABS, LR, BV)"
  access: free
  scope: >-
    Marine and offshore classification: approved material grades from approved
    works, survey and witness points during manufacture, welding procedure and
    welder approval, and class certification of the finished item. Class
    surveyors witness in person, which makes the manufacturing sequence part of
    the design problem.

aws_d1_1_en_1090:
  tier: standard
  title: "Structural welding code — steel / Execution of steel and aluminium structures"
  publisher: AWS / CEN
  designation: "AWS D1.1 (US) and EN 1090-2 with EN ISO 3834 (EU)"
  access: paid
  scope: >-
    Structural steel fabrication: weld procedure and welder qualification, joint
    details, distortion and dimensional tolerances, inspection extent by joint
    category. EN 1090 adds execution classes EXC1–EXC4 and CE marking of
    fabricated structural steelwork.

itar_ear:
  tier: standard
  title: "Export control of defence articles and technical data"
  publisher: "US Department of State / Department of Commerce"
  designation: "ITAR (22 CFR 120–130) and EAR (15 CFR 730–774)"
  access: free
  licence: public_domain
  licence_note: "US Government work (17 USC 105)."
  ingestion: full
  scope: >-
    Controls on defence articles and dual-use items — including **technical
    data**, which explicitly covers CAD models, drawings and manufacturing
    process information. Transfer to a foreign person, including electronically
    or by granting access to a server, is an export whether or not anything
    physically moves.
  caution: >-
    This is the control most often broken by ordinary engineering workflow:
    sharing a model with an overseas supplier, or storing it where a foreign
    national employee can open it, is a controlled export.

hygienic_design:
  tier: handbook
  title: "Hygienic design standards for food and pharmaceutical equipment"
  publisher: "3-A SSI / EHEDG"
  designation: "3-A Sanitary Standards; EHEDG design guidelines"
  access: paid
  scope: >-
    The geometry rules for cleanable equipment: self-draining slopes, radiused
    internal corners, continuous ground welds, no dead legs, no exposed threads
    or crevices on product contact, and specified product-contact surface
    roughness.

# ── Additive manufacturing ───────────────────────────────────────────────────

iso_astm_52900:
  tier: standard
  title: "Additive manufacturing — General principles — Fundamentals and vocabulary"
  publisher: ISO / ASTM
  designation: "ISO/ASTM 52900"
  access: paid
  scope: "The seven process categories and the vocabulary everything else uses."

iso_astm_52910:
  tier: standard
  title: "Additive manufacturing — Design — Requirements, guidelines and recommendations"
  publisher: ISO / ASTM
  designation: "ISO/ASTM 52910"
  access: paid
  scope: "Design for AM: when AM is the right answer and what the design must account for."

iso_astm_52911:
  tier: standard
  title: "Additive manufacturing — Design — Part 1: Laser-based powder bed fusion of metals"
  publisher: ISO / ASTM
  designation: "ISO/ASTM 52911-1"
  access: paid
  scope: "L-PBF-specific design guidance: orientation, supports, overhangs, powder removal."

astm_f3301:
  tier: standard
  title: "Standard for Additive Manufacturing — Post Processing Methods"
  publisher: ASTM
  designation: "ASTM F3301"
  access: paid
  scope: "Post-processing of PBF metal parts: stress relief, HIP, support removal, finishing."

astm_f2792_hip:
  tier: standard
  title: "Hot isostatic pressing practice for AM and castings"
  publisher: ASTM / industry practice
  designation: "HIP practice (see ASTM A1080 for steel castings)"
  access: paid
  scope: >-
    HIP closes internal gas porosity and lack-of-fusion that is not surface
    connected. It does not close surface-connected defects and does not fix
    geometry.

# ── Hydrogen, vacuum, nuclear, water, food, sterilisation, electronics ───────

asme_b31_12:
  tier: standard
  title: "Hydrogen Piping and Pipelines"
  publisher: ASME
  designation: "ASME B31.12"
  access: paid
  scope: >-
    The hydrogen-specific piping and pipeline code. Carries hydrogen-specific
    allowable stress tables that restrict or exclude high-strength steels from
    hydrogen service regardless of how they perform in inert-gas service, and
    sets material and temperature limits for hydrogen piping, tubing, valves and
    fittings.
  caution: >-
    Hydrogen compatibility runs inverse to strength. A material qualified for a
    pressure vessel in nitrogen may be excluded in hydrogen at the same pressure.

astm_e595:
  tier: standard
  title: "Standard Test Method for Total Mass Loss and Collected Volatile Condensable Materials from Outgassing in a Vacuum Environment"
  publisher: ASTM
  designation: "ASTM E595"
  access: paid
  scope: >-
    The spacecraft outgassing screen: a specimen held at 125 °C under vacuum for
    24 hours, with total mass loss (TML) and collected volatile condensable
    material (CVCM) measured. NASA's accepted limits are TML ≤ 1.0% and
    CVCM ≤ 0.10%. Applies to organics, polymers, adhesives, coatings,
    elastomers and composite matrices.

astm_e185:
  tier: standard
  title: "Standard Practice for Design of Surveillance Programs for Light-Water Moderated Nuclear Power Reactor Vessels"
  publisher: ASTM
  designation: "ASTM E185"
  access: paid
  scope: >-
    Surveillance of neutron-irradiation embrittlement in reactor pressure vessel
    steels — the practice behind tracking the shift in ductile-to-brittle
    transition temperature over a vessel's life.

asme_nqa1:
  tier: standard
  title: "Quality Assurance Requirements for Nuclear Facility Applications"
  publisher: ASME
  designation: "ASME NQA-1"
  access: paid
  scope: >-
    The nuclear QA programme standard, invoked with 10 CFR 50 Appendix B in the
    US. Adds commercial-grade dedication, extensive design verification, and
    record retention measured in decades rather than years.

nsf_61:
  tier: standard
  title: "Drinking Water System Components — Health Effects"
  publisher: NSF / ANSI
  designation: "NSF/ANSI/CAN 61"
  access: paid
  scope: >-
    Certification of materials and components in contact with potable water,
    based on what leaches from the finished component into water — including
    coatings, elastomers, solders and metal alloys. Lead-content limits are
    governed separately (NSF/ANSI 372 and national law).

fda_food_contact:
  tier: standard
  title: "Indirect food additives — food-contact substances"
  publisher: US FDA
  designation: "21 CFR Parts 174–190"
  edition: "plus EU Regulation 1935/2004 and 10/2011 for the EU"
  access: free
  licence: public_domain
  licence_note: "US Government work (17 USC 105). The cited EU regulations are separately reusable with attribution."
  ingestion: full
  scope: >-
    What a material in contact with food may be made of, and what may migrate
    from it. Complemented by hygienic-design practice (3-A Sanitary Standards,
    EHEDG) which governs the geometry: drainability, crevice-free joints,
    cleanable surface finish.

iso_17665_11135_11137:
  tier: standard
  title: "Sterilization of health care products — moist heat / ethylene oxide / radiation"
  publisher: ISO
  designation: "ISO 17665, ISO 11135, ISO 11137"
  access: paid
  scope: >-
    Validation and control of the three dominant sterilisation routes. Each
    imposes different material constraints: repeated steam autoclaving hydrolyses
    some polymers, EO requires aeration and diffusion access, and gamma
    irradiation degrades polypropylene and PTFE while leaving metals unaffected.

iso_9223:
  tier: standard
  title: "Corrosion of metals and alloys — Corrosivity of atmospheres — Classification, determination and estimation"
  publisher: ISO
  designation: "ISO 9223"
  access: paid
  scope: >-
    Atmospheric corrosivity categories C1–CX by time-of-wetness, chloride and
    sulphur dioxide deposition. The defensible way to say "coastal" or
    "industrial" as a design input rather than as an adjective.

ipc_2221:
  tier: standard
  title: "Generic Standard on Printed Board Design"
  publisher: IPC
  designation: "IPC-2221 (with IPC-A-610 for acceptance)"
  access: paid
  scope: >-
    Electrical clearance and creepage by voltage and pollution degree, conductor
    sizing for current and temperature rise, and the acceptance criteria for
    assembled electronics. The design rules that govern any enclosure or
    mechanical part sharing space with live circuits.

