name: sc-integration-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scalecad_integration
      POSTGRES_DB: scalecad_integration
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Run environment.py bootstrap first}
    ports:
      - "127.0.0.1:18832:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scalecad_integration -d scalecad_integration"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 512m
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:18879:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 256m
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-integration-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${LOCAL_KEYCLOAK_ADMIN_PASSWORD:?Run environment.py bootstrap first}
      KC_HOSTNAME: http://localhost:18080
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./.state/realm:/opt/keycloak/data/import:ro
    mem_limit: 1g

volumes:
  postgres_data:
  redis_data:
  keycloak_data:
